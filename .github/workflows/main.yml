name: Publish Package

on:
  push:
    branches: [main]
  #  平台故障等原因导致 push 未触发时，可在 Actions 页面手动重跑
  workflow_dispatch:

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  publish:
    #  固定系统版本，避免 ubuntu-latest 迁移到新系统时运行环境突变
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          #  与生成 pnpm-lock.yaml 的版本保持一致，pnpm 8 读不了 v9 lockfile 会忽略它重新解析
          version: 9.14.2

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: "pnpm"

      #  provenance 需要 npm 11.5.1 以上
      #  不用 @latest：npm 12 要求 node >= 22.22.2，会和上面的 node 20 冲突
      - name: Update npm
        run: npm install -g npm@11

      - run: pnpm install --frozen-lockfile
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build

      - name: Check published version
        id: published
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$NAME@$VERSION 已发布，跳过 npm publish"
          fi

      - if: steps.published.outputs.exists != 'true'
        run: npm publish --provenance --access public
