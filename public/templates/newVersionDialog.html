<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="https://chat.openai.com/favicon-32x32.png"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>有可用的更新</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, Helvetica, Arial, sans-serif,
          "Microsoft YaHei", "ST Heiti";
        color: #333;
        padding: 20px;
        background-color: #f5f5f5;
      }

      .title {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 10px;
      }

      .content {
        margin-top: 8px;
        margin-bottom: 12px;
        margin-left: -20px;
        margin-right: -20px;
        height: 200px;
        overflow: auto;
        padding: 0 20px;
      }

      .content ul {
        padding-left: 20px;
        margin-top: 5px;
        margin-bottom: 10px;
      }

      .content ul li {
        margin-bottom: 4px;
      }

      .buttons-box {
        display: flex;
        justify-content: flex-end;
      }

      .buttons-box button {
        padding: 10px 20px;
        font-size: 14px;
        font-weight: bold;
        border-radius: 5px;
        border: none;
        cursor: pointer;
        margin-left: 12px;
      }

      .buttons-box button:first-child {
        background-color: #007bff;
        color: #fff;
      }

      .buttons-box button:last-child {
        background-color: #ccc;
        color: #333;
      }

      .buttons-box button:first-child:hover {
        background-color: #0056b3;
      }

      .buttons-box button:last-child:hover {
        background-color: #b3b3b3;
      }

      .title-bar {
        display: flex;
        flex-direction: row;
        justify-content: flex-start;
        align-items: center;
      }

      .title-bar img {
        margin-right: 12px;
      }

      .loading-box {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        right: 0;
        background: rgba(255, 255, 255, 0.9);
        font-size: 18px;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        display: none;
        font-weight: bold;
      }

      .error-box {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        right: 0;
        background: #fff;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        display: none;
        padding: 20px;
        text-align: center;
      }

      .error-box .error-title {
        font-size: 18px;
        font-weight: bold;
        color: #d93026;
        margin-bottom: 12px;
      }

      .error-box .error-message {
        font-size: 14px;
        line-height: 1.6;
        margin-bottom: 8px;
      }

      .error-box .error-code {
        font-size: 12px;
        color: #999;
        margin-bottom: 12px;
      }

      .error-box .error-detail {
        width: 100%;
        max-height: 90px;
        overflow: auto;
        box-sizing: border-box;
        padding: 8px;
        margin-bottom: 12px;
        border: 1px solid #e0e0e0;
        border-radius: 4px;
        background: #fafafa;
        font-family: Menlo, Consolas, monospace;
        font-size: 11px;
        line-height: 1.5;
        color: #666;
        text-align: left;
        white-space: pre-wrap;
        word-break: break-all;
        user-select: text;
        cursor: text;
      }

      .error-box .buttons-box button.copy-btn {
        background-color: #f0f0f0;
        color: #333;
        border: 1px solid #d0d0d0;
      }
    </style>
  </head>
  <body>
    <div class="loading-box">软件更新中……</div>
    <div class="error-box">
      <div class="error-title">更新失败</div>
      <div class="error-message"></div>
      <div class="error-code"></div>
      <div class="error-detail"></div>
      <div class="buttons-box">
        <button id="retryBtn">重试</button>
        <button id="copyErrorBtn" class="copy-btn">复制错误信息</button>
        <button id="closeBtn">关闭</button>
      </div>
    </div>
    <div class="title-bar">
      <img src="" width="34" class="logo" style="display: none" />
      <span>有可用的新版本：</span>
      <a
        href="#"
        class="see-all-changes"
        style="text-decoration: underline; font-size: 14px"
        >（所有版本更新记录）</a
      >
    </div>
    <div class="content">具体更新内容请查看 Changelogs</div>
    <div class="buttons-box">
      <button id="updateBtn">现在更新</button>
      <button id="skipBtn">稍后再提醒我</button>
    </div>

    <script>
      const { ipcRenderer, clipboard } = require("electron");

      const loadingBoxRef = document.querySelector(".loading-box");
      const errorBoxRef = document.querySelector(".error-box");

      function startUpdate() {
        ipcRenderer.send("evd-update-now");
        errorBoxRef.style.display = "none";
        loadingBoxRef.style.display = "flex";
      }

      document
        .querySelector("#updateBtn")
        .addEventListener("click", startUpdate);
      document
        .querySelector("#retryBtn")
        .addEventListener("click", startUpdate);

      document.querySelector("#skipBtn").addEventListener("click", () => {
        ipcRenderer.send("evd-skip");
      });

      document.querySelector("#closeBtn").addEventListener("click", () => {
        ipcRenderer.send("evd-skip");
      });

      const copyErrorBtnRef = document.querySelector("#copyErrorBtn");
      let errorDetailText = "";

      copyErrorBtnRef.addEventListener("click", () => {
        clipboard.writeText(errorDetailText);
        copyErrorBtnRef.textContent = "已复制";
        setTimeout(() => (copyErrorBtnRef.textContent = "复制错误信息"), 2000);
      });

      ipcRenderer.on("evd-update-error", (_, error) => {
        errorDetailText = error.detail || error.message;
        loadingBoxRef.style.display = "none";
        errorBoxRef.querySelector(".error-message").textContent = error.message;
        errorBoxRef.querySelector(".error-code").textContent = error.code;
        errorBoxRef.querySelector(".error-detail").textContent =
          errorDetailText;
        errorBoxRef.style.display = "flex";
      });

      ipcRenderer.invoke("evd-get-logo").then((link) => {
        if (link) {
          const imgRef = document.querySelector(".logo");
          imgRef.src = link;
          imgRef.style.display = "inline-block";
        }
      });

      ipcRenderer.invoke("evd-get-changelogs-link").then((link) => {
        const aTag = document.querySelector(".see-all-changes");
        if (link) {
          aTag.href = link;
        } else {
          aTag.remove();
        }
      });

      ipcRenderer.invoke("evd-get-change-logs").then((data) => {
        //  如果没有数据就不渲染
        if (!data) return;

        const contentRef = document.querySelector(".content");

        contentRef.innerHTML = `
        <p class="title">${data.title}</p>
        ${data.changes}
        `;

        //  监听所有 A 链接点击
        Array.from(document.querySelectorAll("a")).map((a) => {
          a.addEventListener("click", (ev) => {
            ev.preventDefault();

            ipcRenderer.send("evd-open-link", ev.target.href);
          });
        });
      });
    </script>
  </body>
</html>
