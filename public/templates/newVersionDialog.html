<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="https://chat.openai.com/favicon-32x32.png"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>有可用的更新</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, Helvetica, Arial, sans-serif,
          "Microsoft YaHei", "ST Heiti";
        color: #333;
        padding: 20px;
        background-color: #f5f5f5;
      }

      .title {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 10px;
      }

      .content {
        margin-top: 8px;
        margin-bottom: 12px;
        margin-left: -20px;
        margin-right: -20px;
        height: 200px;
        overflow: auto;
        padding: 0 20px;
      }

      .content ul {
        padding-left: 20px;
        margin-top: 5px;
        margin-bottom: 10px;
      }

      .content ul li {
        margin-bottom: 4px;
      }

      .buttons-box {
        display: flex;
        justify-content: flex-end;
      }

      .buttons-box button {
        padding: 10px 20px;
        font-size: 14px;
        font-weight: bold;
        border-radius: 5px;
        border: none;
        cursor: pointer;
        margin-left: 12px;
      }

      .buttons-box button:first-child {
        background-color: #007bff;
        color: #fff;
      }

      .buttons-box button:last-child {
        background-color: #ccc;
        color: #333;
      }

      .buttons-box button:first-child:hover {
        background-color: #0056b3;
      }

      .buttons-box button:last-child:hover {
        background-color: #b3b3b3;
      }

      .title-bar {
        display: flex;
        flex-direction: row;
        justify-content: flex-start;
        align-items: center;
      }

      .title-bar img {
        margin-right: 12px;
      }

      .loading-box {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        right: 0;
        background: #f5f5f7;
        flex-direction: column;
        justify-content: space-between;
        display: none;
        padding: 16px 18px;
        box-sizing: border-box;
        z-index: 10;
      }

      .stage-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
      }

      .stage-title {
        font-size: 15px;
        font-weight: bold;
        color: #111;
      }

      .stage-percent {
        font-size: 13px;
        font-weight: bold;
        color: #0066cc;
      }

      .progress-track {
        width: 100%;
        height: 7px;
        background: #e0e0e6;
        border-radius: 99px;
        overflow: hidden;
        margin-bottom: 10px;
      }

      .progress-fill {
        height: 100%;
        width: 2%;
        background: linear-gradient(90deg, #007bff, #00a2ff);
        transition: width 0.2s ease, background 0.2s ease;
      }

      .progress-fill.stalled {
        background: #f59e0b;
      }

      .step-list {
        background: #fff;
        border: 1px solid #e5e5ea;
        border-radius: 6px;
        padding: 8px 10px;
        margin-bottom: 8px;
        font-size: 12px;
      }

      .step-row {
        display: flex;
        justify-content: space-between;
        padding: 3px 0;
        color: #666;
      }

      .step-row.done {
        color: #10b981;
      }

      .step-row.current {
        color: #0066cc;
        font-weight: bold;
      }

      .current-file-box {
        background: #eef4ff;
        border: 1px solid #cfe0ff;
        border-radius: 5px;
        padding: 6px 8px;
        font-family: Menlo, Consolas, monospace;
        font-size: 11px;
        color: #1e3a8a;
        margin-bottom: 8px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .stall-alert {
        display: none;
        background: #fff8e6;
        border: 1px solid #ffd591;
        border-radius: 5px;
        padding: 6px 8px;
        font-size: 11px;
        line-height: 1.45;
        color: #b45309;
        margin-bottom: 8px;
      }

      .progress-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: auto;
      }

      .elapsed-text {
        font-size: 11px;
        color: #888;
      }

      .diag-copy-btn {
        padding: 5px 10px;
        font-size: 11px;
        font-weight: 600;
        border-radius: 4px;
        border: 1px solid #d0d0d7;
        background: #fff;
        color: #333;
        cursor: pointer;
      }

      .diag-copy-btn:hover {
        background: #ececf0;
      }

      .error-box {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        right: 0;
        background: #fff;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        display: none;
        padding: 16px 18px;
        text-align: center;
        z-index: 20;
      }

      .error-box .error-title {
        font-size: 17px;
        font-weight: bold;
        color: #d93026;
        margin-bottom: 8px;
      }

      .error-box .error-message {
        font-size: 13px;
        line-height: 1.5;
        margin-bottom: 6px;
      }

      .error-box .error-code {
        font-size: 11px;
        color: #999;
        margin-bottom: 8px;
      }

      .error-box .error-detail {
        width: 100%;
        max-height: 96px;
        overflow: auto;
        box-sizing: border-box;
        padding: 8px;
        margin-bottom: 10px;
        border: 1px solid #e0e0e0;
        border-radius: 4px;
        background: #fafafa;
        font-family: Menlo, Consolas, monospace;
        font-size: 11px;
        line-height: 1.45;
        color: #666;
        text-align: left;
        white-space: pre-wrap;
        word-break: break-all;
        user-select: text;
        cursor: text;
      }

      .error-box .buttons-box button.copy-btn {
        background-color: #f0f0f0;
        color: #333;
        border: 1px solid #d0d0d0;
      }
    </style>
  </head>
  <body>
    <div class="loading-box">
      <div>
        <div class="stage-header">
          <span class="stage-title" id="stageTitle">正在准备更新...</span>
          <span class="stage-percent" id="stagePercent">0%</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="step-list">
          <div class="step-row current" id="row-precheck">
            <span>1. 环境与写入权限检查</span>
            <span id="val-precheck">检查中...</span>
          </div>
          <div class="step-row" id="row-download">
            <span>2. 下载更新包</span>
            <span id="val-download">等待中</span>
          </div>
          <div class="step-row" id="row-unzip">
            <span>3. 解压更新包</span>
            <span id="val-unzip">等待中</span>
          </div>
          <div class="step-row" id="row-install">
            <span>4. 更新本地文件</span>
            <span id="val-install">等待中</span>
          </div>
          <div class="step-row" id="row-relaunch">
            <span>5. 重启应用</span>
            <span id="val-relaunch">等待中</span>
          </div>
        </div>
        <div class="current-file-box" id="currentFileBox">
          当前处理: 正在初始化...
        </div>
        <div class="stall-alert" id="stallAlert"></div>
      </div>
      <div class="progress-footer">
        <span class="elapsed-text" id="elapsedText">已用时: 00:00</span>
        <button id="copyProgressDiagBtn" class="diag-copy-btn">
          复制当前诊断信息
        </button>
      </div>
    </div>
    <div class="error-box">
      <div class="error-title">更新失败</div>
      <div class="error-message"></div>
      <div class="error-code"></div>
      <div class="error-detail"></div>
      <div class="buttons-box">
        <button id="retryBtn">重试</button>
        <button id="copyErrorBtn" class="copy-btn">复制错误信息</button>
        <button id="closeBtn">关闭</button>
      </div>
    </div>
    <div class="title-bar">
      <img src="" width="34" class="logo" style="display: none" />
      <span>有可用的新版本：</span>
      <a
        href="#"
        class="see-all-changes"
        style="text-decoration: underline; font-size: 14px"
        >（所有版本更新记录）</a
      >
    </div>
    <div class="content">具体更新内容请查看 Changelogs</div>
    <div class="buttons-box">
      <button id="updateBtn">现在更新</button>
      <button id="skipBtn">稍后再提醒我</button>
    </div>

    <script>
      const { ipcRenderer, clipboard } = require("electron");

      const STAGE_ORDER = [
        "precheck",
        "download",
        "unzip",
        "install",
        "relaunch",
      ];
      const loadingBoxRef = document.querySelector(".loading-box");
      const errorBoxRef = document.querySelector(".error-box");
      const stageTitleRef = document.querySelector("#stageTitle");
      const stagePercentRef = document.querySelector("#stagePercent");
      const progressFillRef = document.querySelector("#progressFill");
      const currentFileBoxRef = document.querySelector("#currentFileBox");
      const stallAlertRef = document.querySelector("#stallAlert");
      const elapsedTextRef = document.querySelector("#elapsedText");
      const copyProgressDiagBtnRef = document.querySelector(
        "#copyProgressDiagBtn"
      );
      const copyErrorBtnRef = document.querySelector("#copyErrorBtn");

      let currentDiagnosticText = "";
      let errorDetailText = "";

      function formatDuration(sec) {
        const s = Math.max(0, Number(sec) || 0);
        const mm = String(Math.floor(s / 60)).padStart(2, "0");
        const ss = String(s % 60).padStart(2, "0");
        return `${mm}:${ss}`;
      }

      function startUpdate() {
        errorBoxRef.style.display = "none";
        stallAlertRef.style.display = "none";
        loadingBoxRef.style.display = "flex";
        ipcRenderer.send("evd-update-now");
      }

      document
        .querySelector("#updateBtn")
        .addEventListener("click", startUpdate);
      document
        .querySelector("#retryBtn")
        .addEventListener("click", startUpdate);

      document.querySelector("#skipBtn").addEventListener("click", () => {
        ipcRenderer.send("evd-skip");
      });

      document.querySelector("#closeBtn").addEventListener("click", () => {
        ipcRenderer.send("evd-skip");
      });

      copyProgressDiagBtnRef.addEventListener("click", () => {
        clipboard.writeText(currentDiagnosticText || "正在采集诊断信息...");
        copyProgressDiagBtnRef.textContent = "已复制诊断信息";
        setTimeout(
          () => (copyProgressDiagBtnRef.textContent = "复制当前诊断信息"),
          2000
        );
      });

      copyErrorBtnRef.addEventListener("click", () => {
        clipboard.writeText(errorDetailText);
        copyErrorBtnRef.textContent = "已复制";
        setTimeout(() => (copyErrorBtnRef.textContent = "复制错误信息"), 2000);
      });

      ipcRenderer.on("evd-update-progress", (_, state) => {
        if (!state) return;
        currentDiagnosticText = state.diagnosticText || "";
        stageTitleRef.textContent = state.stageTitle || "正在更新...";
        const pct = Math.max(0, Math.min(100, Number(state.percent) || 0));
        stagePercentRef.textContent = `${pct}%`;
        progressFillRef.style.width = `${pct}%`;

        if (state.stalled) {
          progressFillRef.classList.add("stalled");
          stallAlertRef.textContent = `⚠️ 耗时较长提示：${
            state.stalledReason || "当前步骤响应较慢"
          }`;
          stallAlertRef.style.display = "block";
        } else {
          progressFillRef.classList.remove("stalled");
          stallAlertRef.style.display = "none";
        }

        const currentIdx = STAGE_ORDER.indexOf(state.stage);
        STAGE_ORDER.forEach((stageKey, idx) => {
          const rowEl = document.querySelector(`#row-${stageKey}`);
          const valEl = document.querySelector(`#val-${stageKey}`);
          if (rowEl) {
            rowEl.className =
              idx < currentIdx
                ? "step-row done"
                : idx === currentIdx
                ? "step-row current"
                : "step-row";
          }
          if (valEl && state.stepValues && state.stepValues[stageKey]) {
            valEl.textContent = state.stepValues[stageKey];
          }
        });

        currentFileBoxRef.textContent = `当前处理: ${state.currentItem || "-"}`;
        elapsedTextRef.textContent = `已用时: ${formatDuration(
          state.elapsedSeconds
        )}`;
      });

      ipcRenderer.on("evd-update-error", (_, error) => {
        errorDetailText = error.detail || error.message;
        loadingBoxRef.style.display = "none";
        errorBoxRef.querySelector(".error-message").textContent = error.message;
        const codeParts = [error.code, error.stage, error.progress].filter(
          Boolean
        );
        errorBoxRef.querySelector(".error-code").textContent =
          codeParts.join(" · ");
        errorBoxRef.querySelector(".error-detail").textContent =
          errorDetailText;
        errorBoxRef.style.display = "flex";
      });

      ipcRenderer.invoke("evd-get-logo").then((link) => {
        if (link) {
          const imgRef = document.querySelector(".logo");
          imgRef.src = link;
          imgRef.style.display = "inline-block";
        }
      });

      ipcRenderer.invoke("evd-get-changelogs-link").then((link) => {
        const aTag = document.querySelector(".see-all-changes");
        if (link) {
          aTag.href = link;
        } else {
          aTag.remove();
        }
      });

      ipcRenderer.invoke("evd-get-change-logs").then((data) => {
        //  如果没有数据就不渲染
        if (!data) return;

        const contentRef = document.querySelector(".content");

        contentRef.innerHTML = `
        <p class="title">${data.title}</p>
        ${data.changes}
        `;

        //  监听所有 A 链接点击
        Array.from(document.querySelectorAll("a")).map((a) => {
          a.addEventListener("click", (ev) => {
            ev.preventDefault();

            ipcRenderer.send("evd-open-link", ev.target.href);
          });
        });
      });
    </script>
  </body>
</html>
